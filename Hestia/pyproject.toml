[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hestia-cleanroom-sim"
version = "0.1.0"
description = "Reproducible smart-home resident activity and sensor-log simulator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "networkx>=3.2,<4",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
  "simpy>=4.1,<5",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
smart-home-sim = "smart_home_sim.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_home_sim"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
