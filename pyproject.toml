[project]
name = "casas-state-transition-visualizer"
version = "0.1.0"
description = "CASASデータセットを用いたスマートホーム状態遷移の可視化システム"
requires-python = ">=3.8"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
