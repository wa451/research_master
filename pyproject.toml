[project]
name = "master-research"
version = "0.1.0"
description = "CASASデータセットを用いたスマートホーム状態遷移の可視化システム"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "mlxtend>=0.23.0",
    "google-genai>=1.47.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/behavior_pattern_mining"]
